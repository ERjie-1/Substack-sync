name: Sync Substack to Notion

on:
  # 定时运行（GitHub cron 使用 UTC；以下注释为北京时间/BJT）
  # 运行日：工作日 + 周日（BJT）；周六（BJT）仅 08:00 和 20:00
  schedule:
    # --- 每5小时一次（BJT 00:00/05:00/10:00/15:00；20:00 由晚间半小时窗口覆盖，避免重复）---
    # BJT 00:00 -> UTC 16:00 前一日（UTC 周六/周日/周一/周二/周三/周四）
    - cron: '0 16 * * 6,0-4'
    # BJT 05:00 -> UTC 21:00 前一日（UTC 周六/周日/周一/周二/周三/周四）
    - cron: '0 21 * * 6,0-4'
    # BJT 10:00 -> UTC 02:00 当日（UTC 周日/周一/周二/周三/周四/周五）
    - cron: '0 2 * * 0-5'
    # BJT 15:00 -> UTC 07:00 当日（UTC 周日/周一/周二/周三/周四/周五）
    - cron: '0 7 * * 0-5'

    # --- 早上 07:00-09:00 每30分钟（BJT）---
    # BJT 07:00/07:30 -> UTC 23:00/23:30 前一日（UTC 周六/周日/周一/周二/周三/周四）
    - cron: '0,30 23 * * 6,0-4'
    # BJT 08:00/08:30 -> UTC 00:00/00:30 当日（UTC 周日/周一/周二/周三/周四/周五）
    - cron: '0,30 0 * * 0-5'
    # BJT 09:00 -> UTC 01:00 当日（UTC 周日/周一/周二/周三/周四/周五）
    - cron: '0 1 * * 0-5'

    # --- 晚上 20:00-23:00 每30分钟（BJT）---
    # BJT 20:00-22:30 -> UTC 12:00-14:30 当日（UTC 周日/周一/周二/周三/周四/周五）
    - cron: '0,30 12-14 * * 0-5'
    # BJT 23:00 -> UTC 15:00 当日（UTC 周日/周一/周二/周三/周四/周五）
    - cron: '0 15 * * 0-5'

    # --- 周六（BJT）08:00 和 20:00 ---
    # BJT 周六 08:00 -> UTC 周六 00:00
    - cron: '0 0 * * 6'
    # BJT 周六 20:00 -> UTC 周六 12:00
    - cron: '0 12 * * 6'

  # 允许手动触发
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      max_emails:
        description: 'Maximum emails to fetch'
        required: false
        default: '50'
      message_ids:
        description: 'Optional comma-separated Gmail message IDs for bounded recovery'
        required: false
        default: ''
      sender_email:
        description: 'Optional exact sender email filter for bounded test runs'
        required: false
        default: ''
      sync_lookback_days:
        description: 'Optional lookback window in days for bounded test/backfill runs'
        required: false
        default: '21'
      title_prefix:
        description: 'Optional Notion title prefix for isolated test pages'
        required: false
        default: ''
      notion_database_id:
        description: 'Optional explicit DB1 id for an owner-authorized test run'
        required: false
        default: ''
      source_filter:
        description: 'Optional exact downstream DB1 发件人 filter for bounded archive runs'
        required: false
        default: ''
      rename_page_id:
        description: 'Optional existing Notion page id to rename before a bounded backfill'
        required: false
        default: ''
      rename_title:
        description: 'Optional normal title paired with rename_page_id'
        required: false
        default: ''
      translation_diagnostic_only:
        description: 'Only call translation and write receipt; never write Notion or dispatch downstream'
        required: false
        default: 'false'
      phase4_dry_run:
        description: 'Bounded Phase 4 Gmail read-only path; must not write or dispatch'
        required: false
        default: false
        type: boolean
      phase4_header_probe:
        description: 'Bounded Phase 4 Gmail header-only subject probes; must not read body or dispatch'
        required: false
        default: false
        type: boolean
      phase4_manifest_id:
        description: 'Frozen Phase 4 run manifest id'
        required: false
        default: ''
      phase4_manifest_sha:
        description: 'Frozen Phase 4 manifest SHA256'
        required: false
        default: ''
      phase4_registry_sha:
        description: 'Byte-identical registry SHA256'
        required: false
        default: 'eb2f5e0f6d1f58232cd99dc96e4b9b6dcada2f7976f4f13df39caf84368fbe85'
      phase4_source_ids:
        description: 'Exact bounded source ids'
        required: false
        default: 'citrini,capitalflow,sleepy'
      phase4_max_emails:
        description: 'Bounded Gmail read limit'
        required: false
        default: '50'
      phase4_lookback_days:
        description: 'Bounded Gmail lookback'
        required: false
        default: '21'
      phase4_message_ids:
        description: 'Optional bounded Gmail message ids'
        required: false
        default: ''

concurrency:
  group: sync-${{ github.event_name == 'schedule' && 'prod' || github.event.inputs.environment || 'prod' }}
  cancel-in-progress: true

jobs:
  phase4-dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase4_dry_run == true && inputs.phase4_header_probe != true }}
    runs-on: ubuntu-latest
    # Phase 4 remains read-only; use the already validated prod environment
    # credential without enabling the production sync job below.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Read bounded Gmail and emit isolated receipt
        env:
          GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
        run: |
          test -n "$GMAIL_TOKEN_BASE64"
          export GMAIL_TOKEN="$(echo "$GMAIL_TOKEN_BASE64" | base64 --decode)"
          test -n "$GMAIL_TOKEN"
          test -n "${{ inputs.phase4_manifest_id }}" && test -n "${{ inputs.phase4_manifest_sha }}"
          PYTHONPATH=. python newsletter_dry_run.py \
            --from-gmail \
            --source-ids '${{ inputs.phase4_source_ids }}' \
            --max-emails '${{ inputs.phase4_max_emails }}' \
            --lookback-days '${{ inputs.phase4_lookback_days }}' \
            --message-ids '${{ inputs.phase4_message_ids }}' \
            --output "newsletter-phase4-substack-${{ github.run_id }}.json" \
            --manifest-id '${{ inputs.phase4_manifest_id }}' \
            --manifest-sha '${{ inputs.phase4_manifest_sha }}' \
            --registry-sha '${{ inputs.phase4_registry_sha }}' \
            --repo-sha "${{ github.sha }}"
      - name: Upload isolated receipt
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-phase4-substack-${{ github.run_id }}
          path: newsletter-phase4-substack-${{ github.run_id }}.json

  phase4-header-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase4_header_probe == true && inputs.phase4_dry_run != true }}
    runs-on: ubuntu-latest
    # Header-only coverage probe; uses the validated prod credential but has
    # no body/attachment or mutator path and cannot enable sync below.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Read exact Gmail headers and emit isolated receipt
        env:
          GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
        run: |
          test -n "$GMAIL_TOKEN_BASE64"
          export GMAIL_TOKEN="$(echo "$GMAIL_TOKEN_BASE64" | base64 --decode)"
          test -n "$GMAIL_TOKEN"
          test -n "${{ inputs.phase4_manifest_id }}" && test -n "${{ inputs.phase4_manifest_sha }}"
          PYTHONPATH=. python newsletter_header_probe.py \
            --output "newsletter-phase4-header-${{ github.run_id }}.json" \
            --manifest-id '${{ inputs.phase4_manifest_id }}' \
            --manifest-sha '${{ inputs.phase4_manifest_sha }}' \
            --registry-sha '${{ inputs.phase4_registry_sha }}' \
            --repo-sha "${{ github.sha }}" \
            --lookback-days 21 \
            --max-results 10
      - name: Upload isolated header receipt
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-phase4-header-${{ github.run_id }}
          path: newsletter-phase4-header-${{ github.run_id }}.json

  sync:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.phase4_dry_run != true && inputs.phase4_header_probe != true) }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'schedule' && 'prod' || github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync script
        id: sync
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ github.event.inputs.notion_database_id || secrets.NOTION_DATABASE_ID }}
          NOTION_API_TOKEN_2: ${{ secrets.NOTION_API_TOKEN_2 }}
          NOTION_DATABASE_ID_2: ${{ secrets.NOTION_DATABASE_ID_2 }}
          GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ENABLE_TRANSLATION: 'true'
          DISABLE_STATUS_SIDE_EFFECTS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'test' || github.event.inputs.sender_email != '' || github.event.inputs.message_ids != '') && 'true' || 'false' }}
          NOTION_GMAIL_MESSAGE_ID_PROPERTY: ${{ vars.NOTION_GMAIL_MESSAGE_ID_PROPERTY }}
          SYNC_RECEIPT_DIR: ./sync_receipts
          SYNC_MESSAGE_IDS: ${{ github.event.inputs.message_ids || '' }}
          MAX_EMAIL_LIMIT: ${{ github.event.inputs.max_emails || '50' }}
          SYNC_SENDER_EMAIL: ${{ github.event.inputs.sender_email || '' }}
          SYNC_LOOKBACK_DAYS: ${{ github.event.inputs.sync_lookback_days || '21' }}
          NOTION_TITLE_PREFIX: ${{ github.event.inputs.title_prefix || '' }}
          RENAME_NOTION_PAGE_ID: ${{ github.event.inputs.rename_page_id || '' }}
          RENAME_NOTION_TITLE: ${{ github.event.inputs.rename_title || '' }}
          TRANSLATION_DIAGNOSTIC_ONLY: ${{ github.event.inputs.translation_diagnostic_only || 'false' }}
        run: |
          export GMAIL_TOKEN="$(echo "$GMAIL_TOKEN_BASE64" | base64 --decode)"
          OUTPUT=$(python sync_substack.py 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          # Extract synced count from "Added N new articles"
          NEW_COUNT=$(echo "$OUTPUT" | grep -oP 'Added \K\d+' || echo "0")
          echo "new_articles=$NEW_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload sync receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substack-sync-receipt-${{ github.run_id }}
          path: sync_receipts/
          if-no-files-found: warn

      - name: Dispatch to article processor
        if: success() && steps.sync.outputs.new_articles != '0' && (github.event_name != 'workflow_dispatch' || github.event.inputs.translation_diagnostic_only != 'true')
        env:
          DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            HTTP_CODE=$(curl -s -o /tmp/dispatch_resp.txt -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $DISPATCH_TOKEN" \
              https://api.github.com/repos/ERjie-1/Articles-process-and-upload-to-Notion/dispatches \
              -d '{"event_type":"notion_new_article","client_payload":{"source":"substack","source_repo":"substack-sync","emitted_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","source_filter":"'"${{ github.event.inputs.source_filter || '' }}"'","title_prefix_filter":"'"${{ github.event.inputs.title_prefix || '' }}"'","download_limit":"'"${{ github.event.inputs.max_emails || '' }}"'"}}')
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Dispatch sent to article-inbox-processor (HTTP $HTTP_CODE)"
            else
              echo "::warning::Dispatch failed with HTTP $HTTP_CODE"
              cat /tmp/dispatch_resp.txt
            fi
          else
            echo "CROSS_REPO_DISPATCH_TOKEN not set, skipping dispatch"
          fi
